name: CI

on: 
  pull_request:
    branches:
      - main
  push:
    branches:
      - main 

jobs:
  run-tests:
    name: ci_jobs
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Run all checks in venv
      run: |
        export PYTHONPATH="${{ github.workspace }}"
        make requirements
        make dev-setup
        make run-checks